name: Deploy production to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build standalone application
        run: npm run build

      - name: Assemble deployment package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .deploy/.next -Force | Out-Null
          Copy-Item -Path .next/standalone/* -Destination .deploy -Recurse -Force
          Copy-Item -Path .next/static -Destination .deploy/.next/static -Recurse -Force
          if (Test-Path public) {
            Copy-Item -Path public -Destination .deploy/public -Recurse -Force
          }

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: production-app
          path: .deploy
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: DEKRA-Secrets
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: production-app
          path: deploy-package

      - name: Deploy to Azure App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy-package
